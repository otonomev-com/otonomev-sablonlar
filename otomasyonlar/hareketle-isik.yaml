alias: Hareketle ışık
description: Hareket algılanınca ışığı açar, hareket bittikten 2 dakika sonra kapatır. (OtonomEv, O1)
mode: restart
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: binary_sensor.koridor_hareket   # (kendi hareket sensörünün varlık kimliği)
    from: "off"
    to: "on"
conditions: []
actions:
  - action: light.turn_on
    target:
      entity_id: light.koridor   # (kendi ışığının varlık kimliği)
  - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.koridor_hareket   # (yukarıdaki sensörün aynısı)
        from: "on"
        to: "off"
  - delay:
      minutes: 2   # (hareket bittikten sonra ışığın kaç dakika açık kalacağı)
  - action: light.turn_off
    target:
      entity_id: light.koridor   # (yukarıdaki ışığın aynısı)
