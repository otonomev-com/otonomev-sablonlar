alias: Banyo nemi yükselince fan
description: Banyoda nem %70'in üstüne çıkınca fanı çalıştırır, %60'ın altına inip 2 dakika öyle kalınca durdurur. (OtonomEv, O16)
mode: single
max_exceeded: silent
triggers:
  - trigger: numeric_state
    entity_id: sensor.banyo_nem   # (banyodaki nem sensörünün varlık kimliği)
    above: 70   # (fanın çalışacağı nem, %)
conditions: []
actions:
  - action: homeassistant.turn_on
    target:
      entity_id: fan.banyo_fani   # (fanın, rölenin ya da prizin varlık kimliği)
  - wait_for_trigger:
      - trigger: numeric_state
        entity_id: sensor.banyo_nem   # (yukarıdaki sensörün aynısı)
        below: 60   # (fanın duracağı nem, %)
        for:
          minutes: 2
    timeout:
      minutes: 60   # (nem düşmese de fan en çok kaç dakika çalışsın)
  - action: homeassistant.turn_off
    target:
      entity_id: fan.banyo_fani   # (yukarıdakinin aynısı)
