alias: Gün batımında ışıklar
description: Güneş batınca ışıkları açar. (OtonomEv, O2)
mode: single
triggers:
  - trigger: sun
    event: sunset
    offset: "00:00:00"   # (önce yanması için eksi: "-00:30:00"; sonra yanması için "00:30:00")
conditions: []
actions:
  - action: light.turn_on
    target:
      entity_id:
        - light.salon   # (kendi ışıklarının varlık kimlikleri; bir ya da daha çok satır)
        - light.balkon
