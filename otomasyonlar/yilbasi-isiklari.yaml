alias: Yılbaşı ışıkları
description: Süs ışıklarını her gün 17:30'da açar, 23:30'da kapatır. (OtonomEv, O36)
mode: single
max_exceeded: silent
triggers:
  - trigger: time
    at: "17:30:00"   # (açılış saati)
    id: ac
  - trigger: time
    at: "23:30:00"   # (kapanış saati)
    id: kapat
conditions: []
actions:
  - if:
      - condition: trigger
        id: ac
    then:
      - action: homeassistant.turn_on
        target:
          entity_id: switch.sus_isiklari   # (süs ışıklarının ya da takıldığı prizin varlık kimliği)
    else:
      - action: homeassistant.turn_off
        target:
          entity_id: switch.sus_isiklari   # (yukarıdakinin aynısı)
