alias: Eve gelince ışıkları ve ısıtmayı hazırla
description: Ev boşken biri eve gelince hava kararmışsa ışıkları açar, kombiyi 21 dereceye ayarlar. (OtonomEv, O7)
mode: single
triggers:
  - trigger: state
    entity_id: zone.home   # (evde kaç kişi olduğunu tutan "Ev" bölgesi)
    from: "0"
conditions: []
actions:
  - if:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
    then:
      - action: light.turn_on
        target:
          entity_id:
            - light.antre   # (açılacak ışıklar; bir ya da daha çok satır)
            - light.salon
  - action: climate.set_temperature
    target:
      entity_id: climate.kombi   # (termostatının varlık kimliği)
    data:
      temperature: 21   # (hedef sıcaklık)
      hvac_mode: heat
