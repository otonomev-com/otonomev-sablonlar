blueprint:
  name: Pili azalan cihazları bildir
  description: >-
    Her gün belirlediğin saatte pil seviyesi eşiğin altına inen bütün cihazları tek bildirimde listeler; pilini
    yalnızca "zayıf" diye bildiren sensörleri de ekler. Pili azalan cihaz yoksa bildirim gelmez. Telefonların ve
    bilgisayarların (Home Assistant uygulamasının) pilleri listeye girmez.
    Anlatım ve sorun giderme: https://otonomev.com/otomasyonlar/pili-azalan-cihazlar/
  domain: automation
  author: OtonomEv
  source_url: https://raw.githubusercontent.com/otonomev-com/otonomev-sablonlar/main/blueprints/automation/otonomev/pili-azalan-cihazlar.yaml
  homeassistant:
    min_version: "2026.11.0"
  input:
    esik:
      name: Pil eşiği
      description: Pil seviyesi bu yüzdenin altına inen cihazlar listelenir.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    saat:
      name: Saat
      description: Listenin her gün geleceği saat.
      default: "10:00:00"
      selector:
        time: {}
    bildirim:
      name: Bildirim gidecek yer
      description: >-
        Telefonundaki Home Assistant uygulamasının bildirim varlığı (telefonunun adını taşır).
        Birden çok telefon seçebilirsin.
      selector:
        entity:
          multiple: true
          filter:
            - domain: notify
    haric:
      name: Listeye girmeyecek piller
      description: >-
        İsteğe bağlı. Listede görmek istemediğin pil sensörleri (ör. şarj edip kullandığın bir kumanda).
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              device_class: battery
            - domain: binary_sensor
              device_class: battery

mode: single

triggers:
  - trigger: time
    at: !input saat

variables:
  esik: !input esik
  haric: !input haric
  dusukler: >-
    {% set disarida = integration_entities('mobile_app') + haric %}
    {% set ns = namespace(liste=[], adlar=[]) %}
    {% for s in states.sensor
         | selectattr('attributes.device_class', 'defined')
         | selectattr('attributes.device_class', 'eq', 'battery')
         | selectattr('state', 'is_number')
         | rejectattr('entity_id', 'in', disarida) %}
      {% if s.state | float < esik | float %}
        {% set ad = device_name(s.entity_id) or s.name %}
        {% set ns.liste = ns.liste + [ad ~ ' (%' ~ (s.state | float | round(0) | int) ~ ')'] %}
        {% set ns.adlar = ns.adlar + [ad] %}
      {% endif %}
    {% endfor %}
    {% for s in states.binary_sensor
         | selectattr('attributes.device_class', 'defined')
         | selectattr('attributes.device_class', 'eq', 'battery')
         | selectattr('state', 'eq', 'on')
         | rejectattr('entity_id', 'in', disarida) %}
      {% set ad = device_name(s.entity_id) or s.name %}
      {% if ad not in ns.adlar %}
        {% set ns.liste = ns.liste + [ad ~ ' (pil zayıf)'] %}
      {% endif %}
    {% endfor %}
    {{ ns.liste }}

conditions:
  - condition: template
    value_template: "{{ dusukler | count > 0 }}"

actions:
  - action: notify.send_message
    target:
      entity_id: !input bildirim
    data:
      message: "Pili azalan cihazlar: {{ dusukler | join(', ') }}"
