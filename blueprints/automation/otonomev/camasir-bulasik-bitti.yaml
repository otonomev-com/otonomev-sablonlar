blueprint:
  name: Çamaşır ya da bulaşık makinesi bitince haber ver
  description: >-
    Makinenin takılı olduğu enerji ölçen akıllı prizin gücünü izler. Makine çalışmaya başlayıp sonra durunca
    telefonuna bildirim gönderir. Çamaşır, bulaşık ve kurutma makinesiyle kullanılabilir.
    Anlatım ve sorun giderme: https://otonomev.com/otomasyonlar/camasir-bulasik-bitti/
  domain: automation
  author: OtonomEv
  source_url: https://raw.githubusercontent.com/otonomev-com/otonomev-sablonlar/main/blueprints/automation/otonomev/camasir-bulasik-bitti.yaml
  homeassistant:
    min_version: "2026.11.0"
  input:
    guc_sensoru:
      name: Güç sensörü
      description: Makinenin takılı olduğu akıllı prizin güç sensörü. Listede yalnızca güç sensörleri çıkar.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    calisma_esigi:
      name: Çalışma eşiği
      description: Güç bu değerin üstüne çıkıp bir dakika orada kalınca makine çalışıyor sayılır.
      default: 10
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          unit_of_measurement: W
          mode: box
    bitis_esigi:
      name: Bitiş eşiği
      description: >-
        Güç bu değerin altına inince makine durmuş sayılır. Makinenin kapalıyken çektiği güçten biraz yüksek
        olmalı.
      default: 5
      selector:
        number:
          min: 0.5
          max: 1000
          step: 0.5
          unit_of_measurement: W
          mode: box
    bekleme_suresi:
      name: Bekleme süresi
      description: >-
        Güç bitiş eşiğinin altında bu kadar dakika kalınca makine bitti sayılır. Makine program arasında uzun
        süre duruyorsa süreyi uzat.
      default: 5
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: dakika
          mode: box
    bildirim:
      name: Bildirim gidecek yer
      description: >-
        Telefonundaki Home Assistant uygulamasının bildirim varlığı (telefonunun adını taşır).
        Birden çok telefon seçebilirsin.
      selector:
        entity:
          multiple: true
          filter:
            - domain: notify
    mesaj:
      name: Mesaj
      description: Bildirimde yazacak cümle.
      default: Çamaşır makinesi bitti.
      selector:
        text:

mode: single
max_exceeded: silent

triggers:
  - trigger: numeric_state
    entity_id: !input guc_sensoru
    above: !input calisma_esigi
    for:
      minutes: 1

actions:
  - wait_for_trigger:
      - trigger: numeric_state
        entity_id: !input guc_sensoru
        below: !input bitis_esigi
        for:
          minutes: !input bekleme_suresi
  - action: notify.send_message
    target:
      entity_id: !input bildirim
    data:
      message: !input mesaj
