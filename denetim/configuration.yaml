# OtonomEv şablon denetimi (.github/workflows/denetim.yml)
#
# GitHub Actions bu klasörü Home Assistant'ın resmî kapsayıcısında check_config ile denetler. Denetimden önce
# şablonlar blueprints/ klasörüne, düz otomasyonlar otomasyonlar/ klasörüne kopyalanır.
# - "automation sablonlar": her şablon, sitedeki "Senden istenecekler" tablosunun örnek girdileriyle kurulur.
# - "automation duz": otomasyonlar/ klasöründeki düz YAML'ların hepsi.
# Varlık kimlikleri örnektir. Denetim biçimi ve şablon girdilerini sınar; cihazların evde olup olmadığına bakmaz.
# Yeni şablon eklenince buraya da bir satır eklenir; girdisi varsayılanla gelenler yazılmaz.

homeassistant:
  name: OtonomEv denetim
  unit_system: metric
  time_zone: Europe/Istanbul

automation sablonlar:
  - id: denetim_acik_kalan_isik_cihaz
    alias: "Denetim: Açık kalan ışık ya da cihaz"
    use_blueprint:
      path: otonomev/acik-kalan-isik-cihaz.yaml
      input:
        cihazlar:
          - light.cocuk_odasi
        ne_yapsin: ikisi
        bildirim:
          - notify.telefon

  - id: denetim_acik_kalan_kapi_pencere
    alias: "Denetim: Açık kalan kapı ya da pencere"
    use_blueprint:
      path: otonomev/acik-kalan-kapi-pencere.yaml
      input:
        sensorler:
          - binary_sensor.balkon_kapisi
        bildirim:
          - notify.telefon

  - id: denetim_banyo_nem_fan
    alias: "Denetim: Banyoda nem yükselince fan"
    use_blueprint:
      path: otonomev/banyo-nem-fan.yaml
      input:
        nem_sensoru: sensor.banyo_nem
        fan: fan.banyo_fani

  - id: denetim_banyoya_girince_muzik
    alias: "Denetim: Banyoya girince müzik"
    use_blueprint:
      path: otonomev/banyoya-girince-muzik.yaml
      input:
        varlik_sensoru: binary_sensor.banyo_varlik
        hoparlor: media_player.banyo_hoparloru
        muzik:
          media_content_id: media-source://radio_browser/istasyon-kimligi
          media_content_type: audio/mpeg

  - id: denetim_camasir_bulasik_bitti
    alias: "Denetim: Çamaşır ya da bulaşık bitti"
    use_blueprint:
      path: otonomev/camasir-bulasik-bitti.yaml
      input:
        guc_sensoru: sensor.camasir_makinesi_prizi_guc
        bildirim:
          - notify.telefon

  - id: denetim_evde_kimse_yokken_supurge
    alias: "Denetim: Evde kimse yokken robot süpürge"
    use_blueprint:
      path: otonomev/evde-kimse-yokken-supurge.yaml
      input:
        supurge:
          - vacuum.robot_supurge
        bildirim:
          - notify.telefon

  - id: denetim_evden_cikinca_kapat
    alias: "Denetim: Evden çıkınca kapat"
    use_blueprint:
      path: otonomev/evden-cikinca-kapat.yaml
      input:
        kapanacaklar:
          - switch.tv_unitesi
        bildirim:
          - notify.telefon

  - id: denetim_eve_gelirken_hazirla
    alias: "Denetim: Eve gelirken hazırla"
    use_blueprint:
      path: otonomev/eve-gelirken-hazirla.yaml
      input:
        isiklar:
          - light.antre
          - light.salon
        termostatlar:
          - climate.kombi

  - id: denetim_gece_modu
    alias: "Denetim: Gece modu"
    use_blueprint:
      path: otonomev/gece-modu.yaml
      input:
        dugme: input_button.gece_modu
        kapanacaklar:
          - switch.tv_unitesi
        bildirim:
          - notify.telefon

  - id: denetim_gun_batiminda_isik
    alias: "Denetim: Gün batımında ışık"
    use_blueprint:
      path: otonomev/gun-batiminda-isik.yaml
      input:
        isiklar:
          - light.salon
          - light.balkon
        zaman_farki:
          hours: 0
          minutes: -30
          seconds: 0

  - id: denetim_hareketle_isik
    alias: "Denetim: Hareketle ışık"
    use_blueprint:
      path: otonomev/hareketle-isik.yaml
      input:
        hareket_sensoru: binary_sensor.koridor_hareket
        isik:
          - light.koridor

  - id: denetim_isitma_programi
    alias: "Denetim: Isıtma programı"
    use_blueprint:
      path: otonomev/isitma-programi.yaml
      input:
        program: schedule.isitma_programi
        termostatlar:
          - climate.kombi

  - id: denetim_oda_soguyunca_isitma
    alias: "Denetim: Oda soğuyunca ısıtma"
    use_blueprint:
      path: otonomev/oda-soguyunca-isitma.yaml
      input:
        sicaklik_sensoru: sensor.yatak_odasi_sicakligi
        isiticilar:
          - climate.yatak_odasi_vana

  - id: denetim_pili_azalan_cihazlar
    alias: "Denetim: Pili azalan cihazlar"
    use_blueprint:
      path: otonomev/pili-azalan-cihazlar.yaml
      input:
        bildirim:
          - notify.telefon
        haric:
          - sensor.kumanda_pil

  - id: denetim_sabah_uyanma_isigi
    alias: "Denetim: Sabah uyanma ışığı"
    use_blueprint:
      path: otonomev/sabah-uyanma-isigi.yaml
      input:
        isiklar:
          - light.yatak_odasi

  - id: denetim_su_kacagi_uyarisi
    alias: "Denetim: Su kaçağı uyarısı"
    use_blueprint:
      path: otonomev/su-kacagi-uyarisi.yaml
      input:
        sensorler:
          - binary_sensor.banyo_su_kacagi
        bildirim:
          - notify.telefon
        vanalar:
          - valve.ana_su_vanasi

  - id: denetim_yilbasi_isiklari
    alias: "Denetim: Yılbaşı ışıkları"
    use_blueprint:
      path: otonomev/yilbasi-isiklari.yaml
      input:
        isiklar:
          - switch.sus_isiklari

  - id: denetim_pencere_acilinca_isitma_kapat
    alias: "Denetim: Pencere açılınca ısıtmayı kapat"
    use_blueprint:
      path: otonomev/pencere-acilinca-isitma-kapat.yaml
      input:
        pencereler:
          - binary_sensor.salon_penceresi
        iklimlendirme:
          - climate.kombi

  - id: denetim_tatil_modu_isiklar
    alias: "Denetim: Tatil modu ışıkları"
    use_blueprint:
      path: otonomev/tatil-modu-isiklar.yaml
      input:
        tatil_modu: input_boolean.tatil_modu
        aksam_isiklari:
          - light.salon
        gece_isiklari:
          - light.yatak_odasi

  - id: denetim_takvim_hatirlatma
    alias: "Denetim: Takvim hatırlatması"
    use_blueprint:
      path: otonomev/takvim-hatirlatma.yaml
      input:
        takvim: calendar.ev
        bildirim:
          - notify.telefon

  - id: denetim_kimse_yokken_kapi_alarm
    alias: "Denetim: Evde kimse yokken kapı açıldı"
    use_blueprint:
      path: otonomev/kimse-yokken-kapi-alarm.yaml
      input:
        sensorler:
          - binary_sensor.antre_kapisi
        bildirim:
          - notify.telefon
        siren:
          - siren.siren

  - id: denetim_perde_sabah_aksam
    alias: "Denetim: Perde sabah açık, akşam kapalı"
    use_blueprint:
      path: otonomev/perde-sabah-aksam.yaml
      input:
        perdeler:
          - cover.salon_perdesi

  - id: denetim_uzun_sure_hareket_yok
    alias: "Denetim: Yakınının evinde uzun süre hareket yok"
    use_blueprint:
      path: otonomev/uzun-sure-hareket-yok.yaml
      input:
        sensorler:
          - binary_sensor.salon_hareket_sensoru
          - binary_sensor.mutfak_hareket_sensoru
        bildirim:
          - notify.telefon

  - id: denetim_nem_kuf_uyarisi
    alias: "Denetim: Nem uzun süre yüksek"
    use_blueprint:
      path: otonomev/nem-kuf-uyarisi.yaml
      input:
        sensorler:
          - sensor.yatak_odasi_nemi
        bildirim:
          - notify.telefon

  - id: denetim_co2_pencereyi_ac
    alias: "Denetim: Karbondioksit yüksek, pencereyi aç"
    use_blueprint:
      path: otonomev/co2-pencereyi-ac.yaml
      input:
        sensorler:
          - sensor.yatak_odasi_karbondioksit
        bildirim:
          - notify.telefon

  - id: denetim_supurge_bitti_takildi
    alias: "Denetim: Robot süpürge bitti ya da takıldı"
    use_blueprint:
      path: otonomev/supurge-bitti-takildi.yaml
      input:
        supurge:
          - vacuum.robot_supurge
        bildirim:
          - notify.telefon

  - id: denetim_gece_tarifesinde_camasir
    alias: "Denetim: Gece tarifesinde çamaşır makinesini çalıştır"
    use_blueprint:
      path: otonomev/gece-tarifesinde-camasir.yaml
      input:
        makine: switch.camasir_makinesi_prizi
        hazir: input_boolean.makine_hazir
        bildirim:
          - notify.telefon

automation duz: !include_dir_list otomasyonlar
